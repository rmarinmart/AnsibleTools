---
# Playbook: Instalación idempotente de GitHub Desktop en Linux Mint
# Uso: ansible-playbook install_github_desktop.yml --ask-become-pass
#      (o con -K si tu usuario usa sudo con contraseña)

- name: Instalar GitHub Desktop (repositorio shiftkey) en Linux Mint
  hosts: all:!localhost
  become: yes

  vars:
    shiftkey_keyring_path: /usr/share/keyrings/mwt-desktop.gpg
    shiftkey_gpg_key_url: "https://mirror.mwt.me/shiftkey-desktop/gpgkey"
    shiftkey_repo_line: >-
      deb [arch=amd64 signed-by={{ shiftkey_keyring_path }}]
      https://mirror.mwt.me/shiftkey-desktop/deb/ any main
    shiftkey_repo_file: /etc/apt/sources.list.d/mwt-desktop.list

  tasks:

    - name: Comprobar que wget y gnupg están instalados
      ansible.builtin.apt:
        name:
          - wget
          - gnupg
        state: present

    - name: Asegurar que el directorio /usr/share/keyrings existe
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Descargar la clave GPG y convertirla a formato binario (dearmor)
      ansible.builtin.shell: |
        set -o pipefail
        wget -qO - {{ shiftkey_gpg_key_url }} | gpg --dearmor > {{ shiftkey_keyring_path }}
      args:
        executable: /bin/bash
        creates: "{{ shiftkey_keyring_path }}"

    - name: Ajustar permisos del keyring
      ansible.builtin.file:
        path: "{{ shiftkey_keyring_path }}"
        mode: "0644"
        state: file

    - name: Añadir el repositorio APT de shiftkey-packages
      ansible.builtin.copy:
        dest: "{{ shiftkey_repo_file }}"
        content: "{{ shiftkey_repo_line }}\n"
        mode: "0644"
        owner: root
        group: root
      register: shiftkey_repo_file_result

    - name: Actualizar la caché de APT si el repositorio cambió
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 30
      when: shiftkey_repo_file_result.changed

    - name: Instalar GitHub Desktop
      ansible.builtin.apt:
        name: github-desktop
        state: present
        update_cache: true
        cache_valid_time: 3600
