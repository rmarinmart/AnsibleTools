---
- name: Instalar GitHub Desktop 
  hosts: all:!localhost
  become: yes

---
# Playbook: Instalación idempotente de GitHub Desktop en Linux Mint

- name: Instalar GitHub Desktop (repositorio shiftkey) en Linux Mint
  hosts: all
  become: true

  vars:
    shiftkey_keyring_path: /usr/share/keyrings/shiftkey-packages.gpg
    shiftkey_gpg_key_url: "https://apt.packages.shiftkey.dev/gpg.key"
    shiftkey_repo_line: >-
      deb [arch=amd64 signed-by={{ shiftkey_keyring_path }}]
      https://apt.packages.shiftkey.dev/ubuntu/ any main
    shiftkey_repo_file: /etc/apt/sources.list.d/shiftkey-packages.list
    tmp_key_path: /tmp/shiftkey-gpg.key

  tasks:

    - name: Asegurar que el directorio /usr/share/keyrings existe
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: Comprobar si la clave GPG ya está instalada
      ansible.builtin.stat:
        path: "{{ shiftkey_keyring_path }}"
      register: shiftkey_key_stat

    - name: Descargar la clave GPG del repositorio (formato ASCII armored)
      ansible.builtin.get_url:
        url: "{{ shiftkey_gpg_key_url }}"
        dest: "{{ tmp_key_path }}"
        mode: "0644"
        force: true
      when: not shiftkey_key_stat.stat.exists

    - name: Convertir la clave GPG a formato binario (dearmor) e instalarla
      ansible.builtin.shell: |
        set -o pipefail
        gpg --dearmor < {{ tmp_key_path }} > {{ shiftkey_keyring_path }}
      args:
        executable: /bin/bash
        creates: "{{ shiftkey_keyring_path }}"
      when: not shiftkey_key_stat.stat.exists

    - name: Ajustar permisos del keyring
      ansible.builtin.file:
        path: "{{ shiftkey_keyring_path }}"
        mode: "0644"
        state: file
      when: not shiftkey_key_stat.stat.exists

    - name: Eliminar el archivo temporal de la clave GPG
      ansible.builtin.file:
        path: "{{ tmp_key_path }}"
        state: absent
      when: not shiftkey_key_stat.stat.exists

    - name: Añadir el repositorio APT de shiftkey-packages
      ansible.builtin.copy:
        dest: "{{ shiftkey_repo_file }}"
        content: "{{ shiftkey_repo_line }}\n"
        mode: "0644"
        owner: root
        group: root
      register: shiftkey_repo_file_result

    - name: Actualizar la caché de APT si el repositorio cambió
      ansible.builtin.apt:
        update_cache: true
      when: shiftkey_repo_file_result.changed

    - name: Instalar GitHub Desktop
      ansible.builtin.apt:
        name: github-desktop
        state: present
        update_cache: true
        cache_valid_time: 3600

