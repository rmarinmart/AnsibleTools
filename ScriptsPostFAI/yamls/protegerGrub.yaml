---
# protegerGrub.yaml
#
# Objetivo:
#   - Definir un superusuario/contraseña (PBKDF2) en GRUB.
#   - Dejar el arranque normal SIN contraseña (--unrestricted).
#   - Exigir contraseña solo para: editar entradas (tecla 'e'), abrir la
#     consola de GRUB (tecla 'c') y entrar en modo rescate/recovery.
#
# Idempotente: se puede volver a ejecutar tras cada 'apt upgrade' de
# grub-common (que puede resetear /etc/grub.d/10_linux y /etc/grub.d/30_os-prober)
# y solo tocará lo que haga falta.
#
# Arranque dual (Windows):
#   Además de 10_linux, se parchea /etc/grub.d/30_os-prober (si existe) para
#   que las entradas de Windows detectadas por os-prober (--class windows
#   --class os) también lleven --unrestricted. En los equipos sin arranque
#   dual ese fichero puede no tener entradas de Windows o incluso no
#   existir; las tareas correspondientes se saltan sin fallar (when).
#   Requiere que os-prober esté instalado y que GRUB_DISABLE_OS_PROBER no
#   esté a "true" en /etc/default/grub, o Windows no aparecerá en el menú.
#
# NOTA: el contenido de /etc/grub.d/01_password se genera embebido en este
# mismo playbook (módulo 'copy' con 'content'), por lo que ya NO depende de
# ningún fichero de plantilla externo (01_password_grub.j2) ni de la ruta
# desde la que se importe/incluya este playbook.
#
# ------------------------------------------------------------------
# PASOS PREVIOS (una sola vez, fuera del playbook):
#
# 1) Generar el hash de la contraseña en tu propia máquina o en el
#    destino (requiere el paquete grub-common, ya instalado si usas GRUB):
#
#      grub-mkpasswd-pbkdf2
#
#    Te pedirá la contraseña dos veces y devolverá una línea como:
#
#      grub.pbkdf2.sha512.10000.AB12....FE90
#
# 2) Guardar ese hash (NO la contraseña en texto plano) en la variable grub_password_hash de este script
#
# ------------------------------------------------------------------

- name: Proteger GRUB con contraseña (edición/rescate) dejando el arranque normal libre
  hosts: all:!localhost
  become: true

  vars:
    grub_admin_user: "mantenimiento"
    grub_password_hash: "grub.pbkdf2.sha512.10000.E6EAC4668338FC2E40F67599A7CA238A3E1DCC7CDF9210790FB0AB0BC2CADBEBED146B18E3FA0914BF4612C6E7783FA10FBF3EF9C70975636D4F7074B0CBE279.AE481F0CFD5257F519008C723B3A4DCBE386BD66F2A18CDE3708992E8FA32CEA7149080A319B5B18475B1C7B6BAFF3DB89FB81F3D09446CCFB53B0905F59E6F4"

  pre_tasks:
    - name: Comprobar que se ha definido el hash de la contraseña
      ansible.builtin.assert:
        that:
          - grub_password_hash is defined
          - grub_password_hash is match('^grub\.pbkdf2\.sha512\.')
        fail_msg: >-
          Falta la variable 'grub_password_hash' o no tiene el formato
          esperado. Genera el hash con 'grub-mkpasswd-pbkdf2' y guárdalo en
          en group_vars (ver cabecera de este playbook).

    - name: Comprobar que grub-mkpasswd-pbkdf2 existe (confirma grub-common instalado)
      ansible.builtin.stat:
        path: /usr/bin/grub-mkpasswd-pbkdf2
      register: grub_mkpasswd_bin
      failed_when: not grub_mkpasswd_bin.stat.exists

  tasks:
    - name: Desplegar script de superusuario/contraseña en /etc/grub.d/01_password
      ansible.builtin.copy:
        dest: /etc/grub.d/01_password
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/bin/sh
          exec tail -n +3 $0
          # Gestionado por Ansible (protegerGrub.yaml) - NO editar a mano, se sobrescribe.
          set superusers="{{ grub_admin_user }}"
          password_pbkdf2 {{ grub_admin_user }} {{ grub_password_hash }}
      notify: Regenerar grub.cfg

    - name: Comprobar que existe la línea CLASS= esperada en 10_linux
      ansible.builtin.command:
        cmd: grep -Fc 'CLASS="--class gnu-linux --class gnu --class os' /etc/grub.d/10_linux
      register: class_line_check
      changed_when: false
      failed_when: class_line_check.stdout | int == 0

    - name: Permitir que las entradas normales arranquen sin contraseña (--unrestricted)
      ansible.builtin.replace:
        path: /etc/grub.d/10_linux
        regexp: '^(CLASS="--class gnu-linux --class gnu --class os)(?!.* --unrestricted)(")$'
        replace: '\1 --unrestricted\2'
        backup: true
      notify: Regenerar grub.cfg

    - name: Comprobar si existe /etc/grub.d/30_os-prober (equipos con arranque dual)
      ansible.builtin.stat:
        path: /etc/grub.d/30_os-prober
      register: os_prober_script

    - name: Permitir que las entradas de Windows detectadas por os-prober arranquen sin contraseña
      ansible.builtin.replace:
        path: /etc/grub.d/30_os-prober
        regexp: '(--class windows --class os)(?!.* --unrestricted)( \$menuentry_id_option)'
        replace: '\1 --unrestricted\2'
        backup: true
      when: os_prober_script.stat.exists
      notify: Regenerar grub.cfg

    - name: Comprobar que GRUB_DISABLE_OS_PROBER no está en "true" en /etc/default/grub
      ansible.builtin.command:
        cmd: grep -Eqx 'GRUB_DISABLE_OS_PROBER=true' /etc/default/grub
      register: os_prober_disabled
      changed_when: false
      failed_when: false
      when: os_prober_script.stat.exists

    - name: Avisar si os-prober está deshabilitado (Windows no aparecerá en el menú)
      ansible.builtin.debug:
        msg: >-
          AVISO: /etc/default/grub tiene GRUB_DISABLE_OS_PROBER=true, por lo
          que aunque esta entrada quede sin restricción, Windows no se
          detectará ni aparecerá en el menú de GRUB. Cambia esa línea a
          GRUB_DISABLE_OS_PROBER=false (o elimínala) y vuelve a lanzar
          update-grub.
      when:
        - os_prober_script.stat.exists
        - os_prober_disabled.rc == 0

  handlers:
    - name: Regenerar grub.cfg
      ansible.builtin.command: update-grub
      register: update_grub_result
      changed_when: true

  post_tasks:
    # Estas comprobaciones se ejecutan siempre (aunque no haya habido
    # cambios) para detectar si algo dejó grub.cfg en un estado incorrecto.
    # Nota: los handlers se lanzan al final de 'tasks', antes de post_tasks,
    # así que grub.cfg ya está actualizado si hubo cambios.
    - name: Verificar que grub.cfg exige contraseña (password_pbkdf2)
      ansible.builtin.command:
        cmd: grep -c "password_pbkdf2 {{ grub_admin_user }}" /boot/grub/grub.cfg
      register: pw_in_cfg
      changed_when: false
      failed_when: pw_in_cfg.stdout | int == 0

    - name: Verificar que hay entradas marcadas como --unrestricted (arranque libre)
      ansible.builtin.command:
        cmd: grep -c -- '--unrestricted' /boot/grub/grub.cfg
      register: unrestricted_in_cfg
      changed_when: false
      failed_when: unrestricted_in_cfg.stdout | int == 0

    - name: Verificar que las entradas de Windows (si existen) quedan sin restricción
      ansible.builtin.command:
        cmd: grep -c -- '--class windows --class os --unrestricted' /boot/grub/grub.cfg
      register: windows_unrestricted_in_cfg
      changed_when: false
      failed_when: false
      when: os_prober_script.stat.exists

    - name: Avisar si no se ha detectado ninguna entrada de Windows sin restricción
      ansible.builtin.debug:
        msg: >-
          AVISO: se esperaba encontrar entradas de Windows con --unrestricted
          en grub.cfg y no se ha encontrado ninguna. Comprueba que os-prober
          detecta Windows correctamente (¿está GRUB_DISABLE_OS_PROBER=true?
          ¿está el disco/partición de Windows accesible?).
      when:
        - os_prober_script.stat.exists
        - windows_unrestricted_in_cfg.stdout | default('0') | int == 0