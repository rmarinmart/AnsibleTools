---
# Playbook para instalar Docker CE en Ubuntu de forma desatendida
# (traducción del script oficial de instalación vía apt)
#
# Uso:
#   ansible-playbook install_docker.yml -i inventario

- name: Instalar Docker CE
  hosts: all:!localhost
  become: true
  vars:
    docker_keyring_path: /etc/apt/keyrings/docker.asc
    docker_sources_path: /etc/apt/sources.list.d/docker.sources
    docker_data_root: /home/docker
    docker_containerd_root: /home/containerd-data
    docker_containerd_old_root: /var/lib/containerd
    docker_containerd_dropin: /etc/systemd/system/containerd.service.d/root.conf
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_users:
      - ciclosm
      - ciclost

  tasks:
    - name: Actualizar caché de apt
      apt:
        update_cache: true
        lock_timeout: 30
        cache_valid_time: 3600

    - name: Instalar dependencias (ca-certificates, curl, rsync)
      # rsync se usa para mover /var/lib/containerd a /home conservando
      # enlaces duros, ACL y xattrs (overlayfs guarda los whiteouts en xattrs).
      apt:
        name:
          - ca-certificates
          - curl
          - rsync
        state: present

    - name: Crear directorio /etc/apt/keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Descargar la clave GPG oficial de Docker
      # Se usa curl en vez del módulo get_url por un bug conocido de ansible-core
      # en Python 3.12+ (HTTPSConnection.__init__() got an unexpected keyword
      # argument 'cert_file'). Si actualizas ansible-core a >=2.16.3 puedes
      # volver a usar el módulo get_url si lo prefieres.
      command: "curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o {{ docker_keyring_path }}"
      args:
        creates: "{{ docker_keyring_path }}"

    - name: Asegurar permisos de lectura para todos en la clave GPG
      file:
        path: "{{ docker_keyring_path }}"
        mode: "0644"

    - name: Obtener la arquitectura de dpkg
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Obtener el codename de Ubuntu subyacente (compatible con derivadas como Linux Mint)
      # Replica la lógica del script original: usa UBUNTU_CODENAME si existe
      # (p.ej. en Mint apunta al Ubuntu base, "noble"), y si no, VERSION_CODENAME.
      # No se puede usar directamente el hecho ansible_distribution_release porque
      # en distribuciones derivadas devuelve el codename propio (p.ej. "zena" en Mint),
      # que no existe en el repositorio de Docker.
      shell: . /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"
      args:
        executable: /bin/bash
      register: docker_apt_codename
      changed_when: false

    - name: Añadir el repositorio de Docker (formato deb822)
      copy:
        dest: "{{ docker_sources_path }}"
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ docker_apt_codename.stdout }}
          Components: stable
          Architectures: {{ dpkg_arch.stdout }}
          Signed-By: {{ docker_keyring_path }}
      register: docker_repo

    - name: Actualizar caché de apt tras añadir el repositorio
      apt:
        update_cache: true
        lock_timeout: 30
      when: docker_repo.changed

    - name: Instalar Docker CE y plugins
      apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Crear la carpeta de datos de Docker en /home
      # Se usa /home como data-root para que imágenes y contenedores vayan a la
      # partición de /home y no a /var/lib/docker, en la raíz. 0711 es el modo
      # con el que dockerd crea su data-root por defecto.
      file:
        path: "{{ docker_data_root }}"
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Configurar daemon.json de Docker
      copy:
        content: |
          {
            "data-root": "{{ docker_data_root }}",
            "bip": "172.35.0.1/16",
            "default-address-pools": [
              {
                "base": "172.36.0.0/16",
                "size": 24
              }
            ]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      # Docker solo lee daemon.json al arrancar
      notify: Reiniciar Docker

    # --- Raíz de containerd en /home ---
    # Desde Docker 29 las instalaciones nuevas usan el almacén de imágenes de
    # containerd: imágenes y capas de contenedores van a la raíz de containerd
    # (/var/lib/containerd) y no al data-root de Docker, así que siguen
    # llenando la partición raíz aunque data-root esté en /home.

    - name: Crear la carpeta de datos de containerd en /home
      # 0711 es el modo con el que containerd crea su raíz por defecto.
      file:
        path: "{{ docker_containerd_root }}"
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Configurar la raíz de containerd con un drop-in de systemd
      # Se pasa --root en la línea de comandos en vez de editar
      # /etc/containerd/config.toml porque ese fichero es un conffile del
      # paquete containerd.io: si se modifica, una actualización puede quedarse
      # preguntando qué versión conservar. El flag tiene prioridad sobre el
      # config.toml. El ExecStart vacío borra el del unit original.
      copy:
        dest: "{{ docker_containerd_dropin }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/containerd --root {{ docker_containerd_root }}
      register: docker_containerd_dropin_result

    - name: Comprobar si queda la raíz antigua de containerd
      stat:
        path: "{{ docker_containerd_old_root }}"
      register: docker_containerd_old_root_stat

    - name: Mover la raíz de containerd a /home
      # Se ejecuta cuando cambia el drop-in (instalación nueva o primera
      # pasada con esta versión del playbook) o cuando sigue existiendo
      # /var/lib/containerd. En una instalación nueva solo hay unas carpetas
      # vacías; en una existente se mueven las imágenes y contenedores.
      # Los contenedores en marcha se paran; los que tengan política de
      # reinicio vuelven a arrancar con Docker.
      when: >-
        docker_containerd_dropin_result.changed or
        (docker_containerd_old_root_stat.stat.exists and
         docker_containerd_old_root_stat.stat.isdir and
         not docker_containerd_old_root_stat.stat.islnk)
      block:
        - name: Recargar systemd para leer el drop-in de containerd
          systemd:
            daemon_reload: true

        - name: Parar Docker y containerd antes de mover los datos
          # Primero docker.socket: si no, una petición al socket vuelve a
          # arrancar docker.service mientras se copian los datos.
          systemd:
            name: "{{ item }}"
            state: stopped
          loop:
            - docker.socket
            - docker.service
            - containerd.service

        - name: Copiar /var/lib/containerd a /home/containerd
          # -H enlaces duros, -A ACL, -X xattrs. Si falla, el playbook se
          # detiene aquí: los datos originales siguen intactos y los servicios
          # quedan parados para que se revise a mano.
          command: >-
            rsync -aHAX --numeric-ids
            {{ docker_containerd_old_root }}/ {{ docker_containerd_root }}/
          when:
            - docker_containerd_old_root_stat.stat.exists
            - docker_containerd_old_root_stat.stat.isdir
            - not docker_containerd_old_root_stat.stat.islnk

        - name: Borrar la raíz antigua de containerd para liberar la partición raíz
          file:
            path: "{{ docker_containerd_old_root }}"
            state: absent
          when:
            - docker_containerd_old_root_stat.stat.exists
            - docker_containerd_old_root_stat.stat.isdir
            - not docker_containerd_old_root_stat.stat.islnk

        - name: Arrancar containerd y Docker con la nueva raíz
          systemd:
            name: "{{ item }}"
            state: started
          loop:
            - containerd.service
            - docker.socket
            - docker.service

    - name: Asegurar que el servicio Docker esté activo y habilitado
      service:
        name: docker
        state: started
        enabled: true

    - name: Obtener los usuarios locales
      getent:
        database: passwd

    - name: Añadir los usuarios existentes al grupo docker
      # Sin el grupo docker no pueden usar el socket del daemon sin sudo.
      # El grupo lo crea el paquete docker-ce. El cambio se aplica en el
      # siguiente inicio de sesión del usuario.
      user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: item in ansible_facts.getent_passwd

    - name: Verificar versión de Docker instalada
      command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Mostrar versión de Docker
      debug:
        msg: "{{ docker_version_output.stdout }}"

  handlers:
    - name: Reiniciar Docker
      service:
        name: docker
        state: restarted
